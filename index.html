<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Treadmill</title>
    <meta name="description" content="Control a PitPat treadmill over Web Bluetooth and track a daily walking goal. No account, no server.">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#fdf6e3">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #fdf6e3;
            --bg-stripe: #f8eccd;
            --surface: #ffffff;
            --ink: #0a0a0a;
            --ink-soft: #2a2a2a;
            --ink-mute: #6b6b6b;
            --rule: #0a0a0a;
            --yellow: #fde047;
            --pink: #f472b6;
            --pink-deep: #ec4899;
            --lime: #a3e635;
            --lime-deep: #84cc16;
            --blue: #60a5fa;
            --red: #ef4444;
            --orange: #fb923c;

            --shadow: 5px 5px 0 var(--ink);
            --shadow-lg: 8px 8px 0 var(--ink);
            --shadow-sm: 3px 3px 0 var(--ink);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            font-weight: 500;
        }
        button { font-family: inherit; }
        h1, h2, h3, h4 { font-weight: 900; letter-spacing: -0.02em; margin: 0; }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg);
            border-bottom: 4px solid var(--rule);
            color: var(--ink);
        }
        .app-header-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.2em;
            height: 64px;
            gap: 1em;
        }
        .app-title {
            font-size: 1.4em;
            font-weight: 900;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            gap: 0.55em;
            text-transform: uppercase;
        }
        .app-title-glyph {
            display: inline-flex;
            width: 34px;
            height: 34px;
            background: var(--yellow);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow-sm);
            align-items: center;
            justify-content: center;
            transform: rotate(-3deg);
        }
        .tab-bar {
            display: flex;
            gap: 0;
            border: 3px solid var(--ink);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }
        .tab {
            color: var(--ink);
            text-decoration: none;
            padding: 0.5em 1.2em;
            font-size: 0.85em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            border-right: 3px solid var(--ink);
            background: var(--surface);
            transition: background 0.1s;
        }
        .tab:last-child { border-right: 0; }
        .tab:hover { background: var(--bg-stripe); }
        .tab.is-active {
            background: var(--ink);
            color: var(--yellow);
        }
        .icon-btn {
            background: var(--surface);
            border: 3px solid var(--ink);
            color: var(--ink);
            cursor: pointer;
            padding: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .icon-btn:hover { background: var(--yellow); }
        .icon-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
        .icon-btn svg { width: 20px; height: 20px; display: block; }

        .panel { display: none; }
        .panel.is-active { display: block; }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.8em 1.2em 4em 1.2em;
        }

        .goal-cards {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 1.4em;
            margin-bottom: 1.8em;
        }
        @media (max-width: 720px) { .goal-cards { grid-template-columns: 1fr; gap: 1.2em; } }
        .goal-card {
            background: var(--surface);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow);
            padding: 1.2em 1.4em;
            position: relative;
        }
        .goal-card h3 {
            font-size: 0.8em;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 900;
            margin-bottom: 0.9em;
            display: inline-block;
            background: var(--ink);
            color: var(--bg);
            padding: 0.25em 0.7em;
            transform: rotate(-1deg);
            position: relative;
            top: -2px;
        }

        .today-headline {
            display: flex;
            align-items: baseline;
            gap: 0.4em;
            margin-bottom: 0.7em;
        }
        .today-main {
            font-size: 2.6em;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
        }
        .today-sub {
            font-size: 0.95em;
            color: var(--ink-mute);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .today-bar {
            position: relative;
            height: 28px;
            background: var(--surface);
            border: 3px solid var(--ink);
            margin-bottom: 0.7em;
            overflow: hidden;
        }
        .today-bar-fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            background: var(--lime);
            border-right: 3px solid var(--ink);
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .today-bar-fill--met { background: var(--yellow); }
        .today-bar-stripe {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: var(--fill, 0%);
            background: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(10,10,10,0.08) 6px, rgba(10,10,10,0.08) 12px);
        }
        .today-status {
            font-size: 0.92em;
            margin-bottom: 0.8em;
            font-weight: 600;
            color: var(--ink-soft);
        }
        .session-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45em;
        }
        .session-chip {
            background: var(--pink);
            color: var(--ink);
            padding: 0.35em 0.75em;
            font-size: 0.82em;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0 var(--ink);
        }
        .session-chip:nth-child(3n+2) { background: var(--blue); }
        .session-chip:nth-child(3n) { background: var(--lime); }
        .session-chip .chip-meta { font-weight: 600; opacity: 0.85; margin-left: 4px; }
        .session-chip--short { background: var(--surface) !important; color: var(--ink-mute); }
        .session-chip--empty {
            background: transparent;
            border: 2px dashed var(--ink-mute);
            box-shadow: none;
            color: var(--ink-mute);
            font-style: italic;
            font-weight: 600;
        }

        .week-chart {
            position: relative;
            display: flex;
            gap: 0.45em;
            height: 130px;
            align-items: stretch;
            padding-top: 4px;
        }
        .week-bar {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-width: 0;
        }
        .week-bar-track {
            position: relative;
            flex: 1;
            background: var(--surface);
            border: 2.5px solid var(--ink);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .week-bar-fill {
            background: var(--lime);
            transition: height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .week-bar--goal .week-bar-fill { background: var(--yellow); }
        .week-bar--weekend .week-bar-track {
            background: repeating-linear-gradient(45deg, var(--surface), var(--surface) 5px, var(--bg-stripe) 5px, var(--bg-stripe) 10px);
            border-style: dashed;
        }
        .week-bar--weekend .week-bar-fill { background: var(--ink-mute); }
        .week-bar--today .week-bar-track { box-shadow: 3px 3px 0 var(--ink); }
        .week-bar-label {
            text-align: center;
            font-size: 0.72em;
            color: var(--ink-soft);
            margin-top: 6px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .week-bar--today .week-bar-label { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
        .week-bar--weekend .week-bar-label { color: var(--ink-mute); }
        .week-goal-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            border-top: 2px dashed var(--red);
            z-index: 1;
            pointer-events: none;
        }
        .week-footer {
            margin-top: 0.8em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78em;
            color: var(--ink-mute);
            font-weight: 700;
        }
        .streak-chip {
            background: var(--orange);
            color: var(--ink);
            padding: 0.35em 0.85em;
            font-weight: 900;
            font-size: 0.85em;
            border: 2.5px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .streak-chip--idle {
            background: var(--surface);
            color: var(--ink-mute);
            font-weight: 700;
            box-shadow: 2px 2px 0 var(--ink);
        }

        .connect-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 1.6em;
        }
        .btn {
            cursor: pointer;
            padding: 0.75em 1.4em;
            font-size: 0.95em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            line-height: 1;
            user-select: none;
            border: 3px solid var(--ink);
            box-shadow: var(--shadow-sm);
            color: var(--ink);
            background: var(--surface);
            transition: transform 0.08s, box-shadow 0.08s, background 0.1s;
            font-family: inherit;
        }
        .btn:not(:disabled):hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
        .btn:not(:disabled):active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn svg { width: 18px; height: 18px; }

        .btn-primary {
            background: var(--pink);
            font-size: 1.05em;
            padding: 0.9em 2em;
            box-shadow: var(--shadow);
        }
        .btn-primary:not(:disabled):hover { box-shadow: 7px 7px 0 var(--ink); }
        .btn-primary:not(:disabled):active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); }
        .btn-connected {
            background: var(--surface);
            font-size: 0.9em;
            padding: 0.7em 1.4em;
        }
        .btn-success { background: var(--yellow); }
        .btn-danger { background: var(--red); color: var(--surface); }
        .btn-neutral { background: var(--surface); }
        .btn-ghost {
            background: transparent;
            border: 0;
            box-shadow: none;
            color: var(--ink);
            font-weight: 700;
            padding: 0.5em 0.9em;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }
        .btn-ghost:hover { transform: none; box-shadow: none; background: var(--bg-stripe); }
        .btn-ghost:active { transform: none; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1em;
            margin-bottom: 1.8em;
        }
        @media (max-width: 720px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 420px) { .stat-grid { grid-template-columns: 1fr 1fr; gap: 0.7em; } }
        .stat {
            background: var(--surface);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow-sm);
            padding: 1em 1.1em;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 98px;
            position: relative;
        }

        .stat:nth-child(1) .stat-label-pill { background: var(--yellow); }
        .stat:nth-child(2) .stat-label-pill { background: var(--pink); }
        .stat:nth-child(3) .stat-label-pill { background: var(--lime); }
        .stat:nth-child(4) .stat-label-pill { background: var(--blue); }
        .stat:nth-child(5) .stat-label-pill { background: var(--orange); }
        .stat:nth-child(6) .stat-label-pill { background: var(--surface); }
        .stat-label-pill {
            display: inline-block;
            background: var(--yellow);
            color: var(--ink);
            font-size: 0.65em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 900;
            padding: 0.25em 0.6em;
            border: 2px solid var(--ink);
            margin-bottom: 0.4em;
            align-self: flex-start;
            line-height: 1;
        }
        .stat-value {
            font-size: 1.85em;
            font-weight: 900;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: -0.03em;
            margin-top: auto;
        }
        .stat-value-sm { font-size: 1.1em; }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.55em;
            padding: 0.4em 0.7em;
            font-size: 0.85em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: var(--surface);
            color: var(--ink);
            border: 2.5px solid var(--ink);
            align-self: flex-start;
            margin-top: auto;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--ink-mute);
            border: 2px solid var(--ink);
            flex: none;
        }
        .status-chip.chip-connected { background: var(--lime); }
        .status-chip.chip-connected .status-dot { background: var(--ink); animation: blink 0.9s ease-in-out infinite alternate; }
        .status-chip.chip-connecting { background: var(--yellow); }
        .status-chip.chip-connecting .status-dot { background: var(--ink); animation: blink 0.4s ease-in-out infinite alternate; }
        .status-chip.chip-paused { background: var(--yellow); }
        .status-chip.chip-paused .status-dot { background: var(--ink); }
        .status-chip.chip-disconnected { background: var(--surface); }
        .status-chip.chip-disconnected .status-dot { background: var(--surface); }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

        .controls-row {
            display: flex;
            gap: 0.9em;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.8em;
        }
        .controls-row .btn {
            padding: 1em 1.5em;
            min-width: 130px;
            justify-content: center;
            font-size: 1em;
            box-shadow: var(--shadow);
        }
        .controls-row .btn:not(:disabled):hover { box-shadow: 7px 7px 0 var(--ink); }
        .controls-row .btn:not(:disabled):active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); }
        .controls-row .speed-btn {
            width: 58px;
            height: 58px;
            min-width: 0;
            padding: 0;
            justify-content: center;
        }
        .controls-row .speed-btn svg { width: 24px; height: 24px; }

        .slider-card {
            background: var(--surface);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow);
            padding: 1.2em 1.4em;
            margin-bottom: 1.8em;
        }
        .slider-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.9em;
        }
        .slider-label {
            font-size: 0.78em;
            font-weight: 900;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: var(--lime);
            border: 2px solid var(--ink);
            padding: 0.25em 0.7em;
        }
        .slider-value {
            font-size: 1.6em;
            font-weight: 900;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }
        .slider-value-unit {
            font-size: 0.55em;
            color: var(--ink-mute);
            font-weight: 800;
            margin-left: 0.2em;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 18px;
            background: linear-gradient(to right, var(--lime) 0%, var(--lime) var(--fill, 0%), var(--surface) var(--fill, 0%), var(--surface) 100%);
            border: 3px solid var(--ink);
            outline: none;
            cursor: pointer;
            transition: background 0.1s ease;
        }
        .speed-slider:disabled { opacity: 0.55; cursor: not-allowed; }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            background: var(--yellow);
            border: 3px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .speed-slider::-webkit-slider-thumb:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
        .speed-slider::-webkit-slider-thumb:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
        .speed-slider::-moz-range-thumb {
            width: 26px;
            height: 26px;
            background: var(--yellow);
            border: 3px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            cursor: pointer;
        }
        .slider-ticks {
            display: flex;
            justify-content: space-between;
            margin-top: 0.7em;
            font-size: 0.75em;
            color: var(--ink-soft);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .history-actions {
            display: flex;
            gap: 0.6em;
            justify-content: flex-end;
            margin-bottom: 1.2em;
        }
        .history-table-wrap {
            background: var(--surface);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92em;
        }
        .history-table thead {
            background: var(--ink);
        }
        .history-table th {
            text-align: left;
            padding: 0.9em 1.1em;
            font-size: 0.7em;
            font-weight: 900;
            color: var(--yellow);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .history-table td {
            padding: 0.9em 1.1em;
            border-bottom: 2px solid var(--ink);
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }
        .history-table tbody tr:last-child td { border-bottom: 0; }
        .history-table tbody tr:hover td { background: var(--bg-stripe); }
        .history-table .num { text-align: right; }
        .history-action-btn {
            background: var(--red);
            border: 2px solid var(--ink);
            color: var(--surface);
            cursor: pointer;
            padding: 0.35em;
            display: inline-flex;
            box-shadow: 2px 2px 0 var(--ink);
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .history-action-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
        .history-action-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
        .history-empty {
            padding: 3em 1em;
            text-align: center;
            color: var(--ink-mute);
            font-style: italic;
            font-weight: 600;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,10,10,0.55);
            z-index: 10001;
            align-items: center;
            justify-content: center;
            padding: 1em;
        }
        .modal-card {
            background: var(--surface);
            border: 4px solid var(--ink);
            box-shadow: var(--shadow-lg);
            padding: 1.6em 1.8em;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            font-size: 1.4em;
            color: var(--ink);
            background: var(--yellow);
            display: inline-block;
            border: 3px solid var(--ink);
            padding: 0.2em 0.6em;
            transform: rotate(-1deg);
            margin-bottom: 0.9em;
        }
        .settings-section {
            border-top: 3px solid var(--ink);
            margin-top: 1.4em;
            padding-top: 1.2em;
        }
        .settings-section h3 {
            font-size: 0.78em;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8em;
            font-weight: 900;
            display: inline-block;
            background: var(--pink);
            border: 2px solid var(--ink);
            padding: 0.25em 0.6em;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1em;
            margin-bottom: 0.8em;
        }
        .settings-row label {
            flex: 1;
            color: var(--ink);
            font-size: 0.92em;
            font-weight: 600;
        }
        .settings-row input[type="number"],
        .settings-row input[type="time"] {
            padding: 0.55em 0.7em;
            border: 3px solid var(--ink);
            font-size: 0.95em;
            width: 6.5em;
            background: var(--surface);
            color: var(--ink);
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }
        .settings-row input[type="number"]:focus,
        .settings-row input[type="time"]:focus { outline: none; background: var(--yellow); }
        .settings-row input[type="number"] { width: 5em; }
        .settings-row input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--ink);
            cursor: pointer;
        }
        .modal-actions {
            display: flex;
            gap: 0.6em;
            justify-content: flex-end;
            margin-top: 1.6em;
        }

        .notif-prompt {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 1em;
            background: var(--yellow);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow-sm);
            padding: 0.9em 1.2em;
            margin-bottom: 1.4em;
            font-size: 0.92em;
            color: var(--ink);
            font-weight: 700;
        }
        .notif-prompt-text { flex: 1; }
        .bt-notice {
            background: var(--orange);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow-sm);
            padding: 0.9em 1.2em;
            margin-bottom: 1.4em;
            font-size: 0.92em;
            color: var(--ink);
            font-weight: 700;
            line-height: 1.45;
        }
        .bt-notice[hidden] { display: none; }
        .notif-prompt button {
            background: var(--ink);
            border: 2px solid var(--ink);
            color: var(--yellow);
            cursor: pointer;
            font-weight: 800;
            padding: 0.5em 0.9em;
            font-family: inherit;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .notif-prompt button:hover { background: var(--surface); color: var(--ink); }

        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(253,246,227,0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--ink);
            border-right-color: transparent;
            background: var(--yellow);
            animation: spin 1.1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #countdownOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--ink);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.5s;
        }
        #countdownNumber {
            color: var(--yellow);
            font-size: 9em;
            font-weight: 900;
            transition: transform 0.3s, opacity 0.3s;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.06em;
        }

        #snackbar {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 80px);
            background: var(--ink);
            color: var(--yellow);
            padding: 0.9em 1.4em;
            font-size: 0.92em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 3px solid var(--ink);
            box-shadow: var(--shadow);
            z-index: 10100;
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s;
            pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        #snackbar.is-visible {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.6em;
        }
        .btn-header {
            padding: 0.5em 0.95em;
            font-size: 0.78em;
            box-shadow: var(--shadow-sm);
            line-height: 1;
        }
        .btn-header .btn-icon svg { width: 16px; height: 16px; }
        .btn-header.btn-primary {
            padding: 0.5em 0.95em;
            font-size: 0.78em;
            box-shadow: var(--shadow-sm);
            animation: connect-pulse 2.4s ease-in-out infinite;
        }
        .btn-header.btn-primary:not(:disabled):hover {
            box-shadow: 5px 5px 0 var(--ink);
            animation: none;
        }
        .btn-header.btn-primary:not(:disabled):active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--ink);
            animation: none;
        }
        .btn-header.btn-connected {
            font-size: 0.78em;
            padding: 0.5em 0.95em;
        }
        @keyframes connect-pulse {
            0%, 100% { box-shadow: 3px 3px 0 var(--ink); }
            50%      { box-shadow: 6px 6px 0 var(--ink); }
        }
        .btn-header.btn-primary:disabled { animation: none; }
        @media (prefers-reduced-motion: reduce) {
            .btn-header.btn-primary { animation: none; }
        }

        @media (max-width: 500px) {
            .container { padding: 1em 0.8em 4em 0.8em; }
            .app-header-inner { padding: 0 0.7em; gap: 0.5em; }
            .app-title { font-size: 1.05em; }
            .app-title-glyph { width: 28px; height: 28px; }
            .tab { padding: 0.45em 0.7em; font-size: 0.75em; }
            .today-main { font-size: 2em; }
            .stat-value { font-size: 1.45em; }
            .controls-row .btn { min-width: 100px; padding: 0.85em 1em; font-size: 0.9em; }
            .controls-row .speed-btn { width: 52px; height: 52px; }
            .btn-header .btn-label { display: none; }
            .btn-header { padding: 0.5em 0.7em; }
            :root { --shadow: 4px 4px 0 var(--ink); --shadow-lg: 6px 6px 0 var(--ink); }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-header-inner">
            <div class="app-title">
                <span class="app-title-glyph">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18h6l2-4 4 8 2-4h4"/>
                    </svg>
                </span>
                Treadmill
            </div>
            <nav class="tab-bar" role="tablist">
                <a href="#controls-panel" class="tab is-active" role="tab">Controls</a>
                <a href="#history-panel" class="tab" role="tab">History</a>
            </nav>
            <div class="header-actions">
                <button id="connectBtn" class="btn btn-primary btn-header">
                    <span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg></span>
                    <span class="btn-label">Connect</span>
                </button>
                <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="panel is-active" id="controls-panel" role="tabpanel">
            <div class="container">
                <div id="btNotice" class="bt-notice" role="alert" hidden></div>
                <div id="notifPrompt" class="notif-prompt">
                    <span class="notif-prompt-text">Enable smart walk reminders during weekdays?</span>
                    <button id="notifPromptYes">Enable</button>
                    <button id="notifPromptNo">Not now</button>
                </div>

                <div class="goal-cards">
                    <div class="goal-card">
                        <h3>Today</h3>
                        <div id="todayCardContent"></div>
                    </div>
                    <div class="goal-card">
                        <h3>Last 7 days</h3>
                        <div id="weekCardContent"></div>
                    </div>
                </div>

                <div class="stat-grid">
                    <div class="stat">
                        <span class="stat-label-pill">Speed</span>
                        <span class="stat-value" id="speed">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label-pill">Distance</span>
                        <span class="stat-value" id="distance">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label-pill">Duration</span>
                        <span class="stat-value" id="duration">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label-pill">Steps</span>
                        <span class="stat-value" id="steps">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label-pill">Calories</span>
                        <span class="stat-value" id="calories">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label-pill">Status</span>
                        <span id="statusChip" class="status-chip chip-disconnected">
                            <span class="status-dot"></span>
                            <span class="chip-text">Disconnected</span>
                        </span>
                    </div>
                </div>

                <div class="controls-row">
                    <button id="speedDownBtn" class="btn btn-neutral speed-btn" disabled title="Speed down" aria-label="Speed down">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>
                    </button>
                    <button id="startBtn" class="btn btn-success" disabled>
                        <span class="btn-icon"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg></span>
                        <span class="btn-label">Start</span>
                    </button>
                    <button id="stopBtn" class="btn btn-danger" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                        Stop
                    </button>
                    <button id="speedUpBtn" class="btn btn-neutral speed-btn" disabled title="Speed up" aria-label="Speed up">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>

                <div class="slider-card">
                    <div class="slider-head">
                        <span class="slider-label">Target speed</span>
                        <span>
                            <span class="slider-value" id="sliderValue">1.0</span><span class="slider-value-unit">kph</span>
                        </span>
                    </div>
                    <input type="range" id="speedSlider" class="speed-slider" min="1" max="6" step="0.1" value="1">
                    <div class="slider-ticks">
                        <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel" id="history-panel" role="tabpanel">
            <div class="container">
                <div class="history-actions">
                    <button id="exportHistoryBtn" class="btn btn-neutral">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Export
                    </button>
                    <button id="importHistoryBtn" class="btn btn-neutral">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        Import
                    </button>
                    <input type="file" id="importHistoryInput" accept="application/json" style="display:none;" />
                </div>
                <div class="history-table-wrap">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Duration</th>
                                <th class="num">Steps</th>
                                <th class="num">Calories</th>
                                <th class="num">Avg Speed</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="loadingOverlay"><div class="spinner"></div></div>
    <div id="countdownOverlay"><span id="countdownNumber">3</span></div>
    <div id="snackbar"></div>

    <div id="settingsOverlay" class="modal-overlay">
        <div class="modal-card">
            <h2>Settings</h2>
            <div class="settings-section" style="border-top:0;margin-top:0;padding-top:0.4em;">
                <h3>Daily goal</h3>
                <div class="settings-row">
                    <label for="cfgDailyMinutes">Goal (minutes)</label>
                    <input id="cfgDailyMinutes" type="number" min="1" step="5">
                </div>
                <div class="settings-row">
                    <label for="cfgMinSession">Min session to count toward 2+ split (min)</label>
                    <input id="cfgMinSession" type="number" min="0" step="1">
                </div>
                <div class="settings-row">
                    <label for="cfgExcludeWeekends">Exclude weekends from goal &amp; reminders</label>
                    <input id="cfgExcludeWeekends" type="checkbox">
                </div>
            </div>
            <div class="settings-section">
                <h3>Reminders</h3>
                <div class="settings-row">
                    <label for="cfgStart">Active hours start</label>
                    <input id="cfgStart" type="time">
                </div>
                <div class="settings-row">
                    <label for="cfgEnd">Active hours end</label>
                    <input id="cfgEnd" type="time">
                </div>
                <div class="settings-row" style="justify-content:flex-start;gap:0.5em;flex-wrap:wrap;">
                    <button id="cfgNotifBtn" class="btn btn-neutral">Enable reminders</button>
                    <button id="cfgInstallBtn" class="btn btn-neutral" style="display:none;">Install app</button>
                </div>
            </div>
            <div class="modal-actions">
                <button id="settingsCloseBtn" class="btn btn-ghost">Cancel</button>
                <button id="settingsSaveBtn" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script src="treadmill.js"></script>
    <script src="goals.js"></script>
    <script src="notifications.js"></script>
    <script>
        (function () {

            function activateTab(href) {
                document.querySelectorAll('.tab').forEach(t => {
                    t.classList.toggle('is-active', t.getAttribute('href') === href);
                });
                document.querySelectorAll('.panel').forEach(p => {
                    p.classList.toggle('is-active', '#' + p.id === href);
                });
            }
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    activateTab(tab.getAttribute('href'));
                });
            });

            if (location.hash === '#history-panel') activateTab('#history-panel');

            const slider = document.getElementById('speedSlider');
            function paintSliderFill() {
                const min = parseFloat(slider.min);
                const max = parseFloat(slider.max);
                const val = parseFloat(slider.value);
                const pct = ((val - min) / (max - min)) * 100;
                slider.style.setProperty('--fill', pct + '%');
            }
            paintSliderFill();
            slider.addEventListener('input', paintSliderFill);

            function boot() {
                if (window.goals && window.goals.init) window.goals.init();
                if (window.notifications && window.notifications.init) window.notifications.init();
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(err => {
                        console.warn('SW registration failed:', err);
                    });
                });
            }
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                window.__deferredInstallPrompt = e;
            });
        })();
    </script>
</body>
</html>
